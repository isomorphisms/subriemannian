name: Executable geometry
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiled-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CHEZ: ${{ github.workspace }}/dependencies/idric/_/.tools/bin/scheme
      IDRIS2_PREFIX: ${{ github.workspace }}/dependencies/idric/_/bootstrap-build
      IDRIS2_PATH: ${{ github.workspace }}/dependencies/idric/_/libs/prelude/build/ttc:${{ github.workspace }}/dependencies/idric/_/libs/base/build/ttc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric
          ref: 2734ac5a86610eddfab73b1644d72b4ac85a65ee
          path: dependencies/idric
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/flexible-pipes
          ref: 07bf355d43d3c5428a435d4fdcbf8cc49847f4a5
          path: dependencies/flexible-pipes
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/kitchen
          ref: 48800be28e228cf80a25a9f6cdef018ce4e873e6
          path: dependencies/kitchen
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: fd4e3a5d051bbebfa5f89a1a45cb6bce4598a82e
          path: dependencies/ai-ci
      - name: Bootstrap the pinned Idriç compiler and existing Chez runtime
        run: ${{ github.workspace }}/dependencies/idric/edric bootstrap
      - name: Compile the source-pinned reproduction controller
        run: >-
          ${{ github.workspace }}/dependencies/idric/_/build/exec/idris2
          --cg chez --source-dir ${{ github.workspace }}/examples/autogenerated/subriemannian
          --build-dir ${{ github.workspace }}/build/controller-ttc
          --output-dir ${{ github.workspace }}/build/controller -o reproduce
          ${{ github.workspace }}/examples/autogenerated/subriemannian/Reproduce.idric
      - name: Flexible Pipes → Kitchen → independent AICI
        run: >-
          ${{ github.workspace }}/build/controller/reproduce
          ${{ github.workspace }} ${{ github.workspace }}/dependencies/idric
          ${{ github.workspace }}/dependencies/flexible-pipes ${{ github.workspace }}/dependencies/kitchen
          ${{ github.workspace }}/dependencies/ai-ci ${{ github.workspace }}/build/evidence
      - name: Install the pinned browser QA driver
        run: npm install --prefix ${{ github.workspace }}/build/browser --no-save playwright@1.62.1
      - name: Obtain the browser runtime
        run: ${{ github.workspace }}/build/browser/node_modules/.bin/playwright install --with-deps chromium --only-shell
      - name: Exercise linked figure controls in a browser
        env:
          NODE_PATH: ${{ github.workspace }}/build/browser/node_modules
        run: >-
          node ${{ github.workspace }}/examples/autogenerated/subriemannian/check-browser.js
          ${{ github.workspace }}/build/evidence/artifacts/heisenberg-loop.html
          ${{ github.workspace }}/build/evidence/artifacts/heisenberg-loop.png
      - name: Retain compiled artifacts, figures and exact-source receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiled-geometry-and-receipts
          path: build/evidence
          if-no-files-found: error
